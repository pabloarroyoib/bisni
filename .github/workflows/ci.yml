name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Valores de relleno: el build no debe depender de Sanity real.
      NEXT_PUBLIC_SANITY_PROJECT_ID: 'ci-project'
      NEXT_PUBLIC_SANITY_DATASET: 'production'
      NEXT_PUBLIC_SITE_URL: 'https://bisni.es'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
