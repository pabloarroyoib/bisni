name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # El build SÍ necesita Sanity real: la home es estática (`○ /`) y se
      # prerenderiza, así que `next build` ejecuta sanityFetch durante la
      # compilación. Con un project ID de relleno Sanity responde 404 y el
      # build falla. Estos dos valores son públicos (NEXT_PUBLIC_* viaja al
      # navegador y el project ID está en la URL de cada imagen del sitio),
      # así que no hace falta ningún secreto: el dataset es público y solo
      # se lee contenido publicado.
      NEXT_PUBLIC_SANITY_PROJECT_ID: '7hpe9nhh'
      NEXT_PUBLIC_SANITY_DATASET: 'production'
      NEXT_PUBLIC_SITE_URL: 'https://bisni.es'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
